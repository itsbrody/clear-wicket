<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clear Wicket — Backup-Codes neu generieren</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;color:#333}
.card{background:#fff;border-radius:8px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.1);width:100%;max-width:420px}
h1{font-size:1.25rem;margin-bottom:1rem;text-align:center}
.warning{background:#fff8e1;border:1px solid #ffe082;padding:.75rem;border-radius:4px;margin-bottom:1rem;font-size:.875rem;color:#795548}
.actions{display:flex;gap:.5rem;margin-top:1rem}
.actions a,.actions button{flex:1;padding:.75rem;border-radius:4px;font-size:.875rem;text-align:center;text-decoration:none;cursor:pointer}
.actions a{background:#f0f0f0;color:#333;border:1px solid #ddd}
.actions a:hover{background:#e0e0e0;border-color:#bbb}
.actions button{background:#4a90d9;color:#fff;border:none}
.actions button:hover{background:#3a7bc8}
</style>
</head>
<body>
<div class="card">
<h1>Backup-Codes neu generieren</h1>
<div class="warning">Alle bestehenden Backup-Codes werden ungültig. Die neuen Codes werden nur einmal angezeigt.</div>
<div class="actions">
<a href="/">Abbrechen</a>
<form method="POST" action="/backup-codes/regenerate" style="flex:1;display:flex">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<button type="submit" style="width:100%">Neue Codes generieren</button>
</form>
</div>
</div>
</body>
</html>
