<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clear Wicket — Setup</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;color:#333}
.card{background:#fff;border-radius:8px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.1);width:100%;max-width:420px}
h1{font-size:1.25rem;margin-bottom:1rem;text-align:center}
p{font-size:.875rem;color:#555;margin-bottom:1rem;text-align:center}
.qr{text-align:center;margin:1.5rem 0}
.qr img{border-radius:4px}
.secret{font-family:monospace;font-size:.875rem;background:#f0f0f0;padding:.75rem;border-radius:4px;text-align:center;word-break:break-all;margin-bottom:1.5rem}
label{display:block;font-size:.875rem;margin-bottom:.25rem;color:#555}
input[type=text]{width:100%;padding:.75rem;border:1px solid #ddd;border-radius:4px;font-size:1.25rem;text-align:center;letter-spacing:.25em;margin-bottom:1rem}
input[type=text]:focus{outline:none;border-color:#4a90d9;box-shadow:0 0 0 2px rgba(74,144,217,.2)}
button{width:100%;padding:.75rem;background:#4a90d9;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer}
button:hover{background:#3a7bc8}
.error{background:#fee;border:1px solid #fcc;color:#c33;padding:.75rem;border-radius:4px;margin-bottom:1rem;font-size:.875rem}
</style>
</head>
<body>
<div class="card">
<h1>TOTP einrichten</h1>
<p>Scanne den QR-Code mit deiner Authenticator-App oder gib das Secret manuell ein.</p>
{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<div class="qr"><img src="data:image/png;base64,{{.QRCode}}" alt="QR Code" width="200" height="200"></div>
<div class="secret">{{.Secret}}</div>
<form method="POST" action="/setup">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
{{if .Redirect}}<input type="hidden" name="rd" value="{{.Redirect}}">{{end}}
<label for="code">Code eingeben zum Bestätigen</label>
<input type="text" id="code" name="code" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" autofocus required>
<button type="submit">Bestätigen</button>
</form>
</div>
</body>
</html>
