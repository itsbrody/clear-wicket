<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clear Wicket — Status</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;color:#333}
.card{background:#fff;border-radius:8px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.1);width:100%;max-width:360px;text-align:center}
h1{font-size:1.25rem;margin-bottom:1rem}
.ok{color:#2e7d32;font-size:1rem;margin-bottom:1.5rem}
.actions{display:flex;flex-direction:column;gap:.5rem}
a{padding:.75rem;border-radius:4px;text-decoration:none;font-size:.875rem;text-align:center}
a.primary{background:#4a90d9;color:#fff}
a.primary:hover{background:#3a7bc8}
a.secondary:hover{background:#e0e0e0;border-color:#bbb}
a.secondary{background:#f0f0f0;color:#333;border:1px solid #ddd}
</style>
</head>
<body>
<div class="card">
<h1>Clear Wicket</h1>
<div class="ok">Authentifiziert als <strong>{{.UserID}}</strong></div>
<div class="actions">
<a href="/backup-codes/regenerate" class="secondary">Backup-Codes neu generieren</a>
<a href="/logout" class="secondary">Abmelden</a>
</div>
</div>
</body>
</html>
