<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clear Wicket — Backup-Codes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;color:#333}
.card{background:#fff;border-radius:8px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.1);width:100%;max-width:420px}
h1{font-size:1.25rem;margin-bottom:.5rem;text-align:center}
.warning{background:#fff8e1;border:1px solid #ffe082;padding:.75rem;border-radius:4px;margin:1rem 0;font-size:.875rem;color:#795548}
.codes{font-family:monospace;font-size:1.1rem;background:#f0f0f0;padding:1rem;border-radius:4px;margin:1rem 0;columns:2;column-gap:1rem}
.codes div{padding:.25rem 0}
.actions{display:flex;gap:.5rem;margin-top:1rem}
.actions a,.actions button{flex:1;padding:.75rem;border-radius:4px;font-size:.875rem;text-align:center;text-decoration:none;cursor:pointer}
.actions a{background:#f0f0f0;color:#333;border:1px solid #ddd}
.actions a:hover{background:#e0e0e0;border-color:#bbb}
.actions button{background:#4a90d9;color:#fff;border:none}
.actions button:hover{background:#3a7bc8}
</style>
</head>
<body>
<div class="card">
<h1>Backup-Codes sichern</h1>
<div class="warning">Diese Codes werden nur einmal angezeigt. Speichere sie an einem sicheren Ort. Jeder Code kann nur einmal verwendet werden.</div>
<div class="codes">
{{range .Codes}}<div>{{.}}</div>{{end}}
</div>
<div class="actions">
<a href="data:text/plain;charset=utf-8,{{.CodesText}}" download="clear-wicket-backup-codes.txt" onclick="this.textContent='Heruntergeladen';this.style.background='#c8e6c9';this.style.borderColor='#a5d6a7'">Herunterladen</a>
<form method="POST" action="{{.ConfirmAction}}" style="flex:1;display:flex">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<button type="submit" style="width:100%">Ich habe die Codes gesichert</button>
</form>
</div>
</div>
</body>
</html>
