# Variant B — Isolated: Each app gets its own Clear Wicket instance with separate TOTP
services:
  traefik:
    image: traefik:v3.6
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  wicket-app1:
    build: ..
    environment:
      COOKIE_DOMAIN: app1.test.local
      AUTH_HOST: wicket-app1.test.local
      DATA_DIR: /data
    volumes:
      - wicket-app1-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.wicket-app1.rule=Host(`wicket-app1.test.local`)
      - traefik.http.routers.wicket-app1.entrypoints=web
      - traefik.http.services.wicket-app1.loadbalancer.server.port=4181
      - traefik.http.middlewares.wicket-app1-auth.forwardauth.address=http://wicket-app1:4181/auth
      - traefik.http.middlewares.wicket-app1-auth.forwardauth.authResponseHeaders=Remote-User

  wicket-app2:
    build: ..
    environment:
      COOKIE_DOMAIN: app2.test.local
      AUTH_HOST: wicket-app2.test.local
      DATA_DIR: /data
    volumes:
      - wicket-app2-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.wicket-app2.rule=Host(`wicket-app2.test.local`)
      - traefik.http.routers.wicket-app2.entrypoints=web
      - traefik.http.services.wicket-app2.loadbalancer.server.port=4181
      - traefik.http.middlewares.wicket-app2-auth.forwardauth.address=http://wicket-app2:4181/auth
      - traefik.http.middlewares.wicket-app2-auth.forwardauth.authResponseHeaders=Remote-User

  app1:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.app1.rule=Host(`app1.test.local`)
      - traefik.http.routers.app1.entrypoints=web
      - traefik.http.routers.app1.middlewares=wicket-app1-auth

  app2:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.app2.rule=Host(`app2.test.local`)
      - traefik.http.routers.app2.entrypoints=web
      - traefik.http.routers.app2.middlewares=wicket-app2-auth

volumes:
  wicket-app1-data:
  wicket-app2-data:
